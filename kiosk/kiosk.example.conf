# pi-dash kiosk settings. Copied to ~/.config/pidash/kiosk.conf by
# install-kiosk.sh. Sourced by pidash-kiosk.sh, so it is shell syntax.
# Log out and back in, or reboot, to apply.

# What to point the browser at. Left blank it uses the Pi's own tailscale0
# address, which is where the service binds by default.
#PIDASH_KIOSK_URL="http://100.68.44.38:8088/"

# The dashboard is dense, and a small panel needs it shrunk to fit. Start at 1.0
# and go down until the Panel tab fits without scrolling. Rough starting points:
#   7" 1024x600 -> 0.8      5" 800x480 -> 0.65      3.5" 480x320 -> 0.5
PIDASH_KIOSK_SCALE="1.0"

# Rotation, for a panel mounted on its side. Both must be set, or neither.
# Connector names come from `wlr-randr`; on a Pi 5 the ports are HDMI-A-1 and
# HDMI-A-2. Transform is one of: normal, 90, 180, 270, flipped, flipped-90.
#PIDASH_KIOSK_OUTPUT="HDMI-A-1"
#PIDASH_KIOSK_ROTATE="90"

# Seconds to wait for the dashboard to answer before starting the browser
# anyway. Covers tailscaled still coming up at boot.
PIDASH_KIOSK_WAIT="120"
